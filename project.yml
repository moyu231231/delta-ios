# xcodegen 工程配置 —— 运行 `xcodegen generate` 生成 AIAimbot.xcodeproj
name: AIAimbot

options:
  bundleIdPrefix: com.aimbot
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  # objectVersion 60（Xcode 15 兼容）；xcodegen 2.45.4 可能无视，Build.sh 里还有 sed 兜底
  objectVersion: 60

targets:
  AIAimbot:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
          - Info.plist
          - build
          - "*.xcodeproj"
          - convert_to_coreml.py
          - "模型/*.pt"
          - "模型/*.onnx"
          - .git
          - .github
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aimbot.delta
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        SWIFT_VERSION: "5.0"
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_MODULES: YES
        # 对齐神之眼巨魔（能跑）的部署目标 14.0，避免 iOS 15 的 chained fixups 导致 TrollStore 闪退
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        # 禁用 dyld chained fixups（正确 flag 是 -no_fixup_chains，之前臆造的 -no_chained_fixups 是错的）
        # chained fixups 是 iOS 15 默认，TrollStore fakesign 处理不了 → 系统拒绝启动闪退
        OTHER_LDFLAGS: "-Wl,-no_fixup_chains"
    dependencies:
      - sdk: Vision.framework
      - sdk: CoreML.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
