# xcodegen 工程配置 —— 运行 `xcodegen generate` 生成 AIAimbot.xcodeproj
name: AIAimbot

options:
  bundleIdPrefix: com.aimbot
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  # objectVersion 60（Xcode 15 兼容）；xcodegen 2.45.4 可能无视，Build.sh 里还有 sed 兜底
  objectVersion: 60

targets:
  AIAimbot:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
          - Info.plist
          - build
          - "*.xcodeproj"
          - convert_to_coreml.py
          - "模型/*.pt"
          - "模型/*.onnx"
          - .git
          - .github
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aimbot.delta
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        SWIFT_VERSION: "5.0"
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_MODULES: YES
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        # 关闭 arm64e 相关，纯巨魔 fakesign 用 arm64
        VALID_ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
    dependencies:
      - sdk: Vision.framework
      - sdk: CoreML.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
