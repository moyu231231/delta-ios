name: 编译三角洲iOS成品

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码（原生 git，绕开 checkout action 的 codeload 故障）
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: 编译
        run: |
          cd ImGui绘制
          rm -rf BaseBin/_external/include
          chmod +x Build.sh
          xcodebuild -project ImGui绘制.xcodeproj \
            -target "ImGui绘制" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            SYMROOT="$PWD/build" \
            build

      - name: 安装 ldid
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install ldid 2>/dev/null || {
            ARCH=$(uname -m)
            curl -sL -o ldid "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_${ARCH}"
            chmod +x ldid
            echo "$PWD" >> "$GITHUB_PATH"
          }

      - name: 签名 + 打包
        run: |
          APP="ImGui绘制/build/Release-iphoneos/ImGui绘制.app"
          ls -d "$APP" || { echo "找不到 .app，编译失败"; exit 1; }
          python3 << 'PYEOF'
          import plistlib
          with open('ImGui绘制/权限/Entitlements.plist','rb') as f:
              d = plistlib.load(f)
          def clean(v):
              if isinstance(v,str):
                  return v.replace('$(TeamIdentifierPrefix)','').replace('$(AppIdentifierPrefix)','').replace('$(CFBundleIdentifier)','com.imgui.app')
              if isinstance(v,list):
                  return [clean(x) for x in v]
              if isinstance(v,dict):
                  return {k:clean(x) for k,x in v.items()}
              return v
          with open('entitlements.plist','wb') as f:
              plistlib.dump(clean(d), f)
          print('entitlements 处理完成')
          PYEOF
          ldid -S entitlements.plist "$APP/ImGui绘制"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qry 三角洲成品.ipa Payload
          ls -la 三角洲成品.ipa

      - name: 上传到 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" 三角洲成品.ipa --title "三角洲成品 $TAG" --notes "自动编译产物" --latest
          echo "✅ 上传成功，去仓库 Releases 页面下载"
